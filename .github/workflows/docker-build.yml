name: Build & Push Docker Images (multiarch: ros1 & ros2)

on:
  push:
    branches:
      - main
    tags:
      - mowgli

env:
  IMAGE_NAME: foxglove-bridge
  REGISTRY: ghcr.io
  REPO: mowglifrenchtouch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        variant:
          - tag: ros1
            file: Dockerfile.ros1
          - tag: ros2
            file: Dockerfile.ros2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.variant.tag }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.variant.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:${{ matrix.variant.tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant.tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.variant.tag }},mode=max
          platforms: linux/amd64,linux/arm64
